[project]
name = "claude-3d"
version = "0.1.0"
description = "Code-driven CAD environment for 3D-printable parts"
requires-python = ">=3.13,<3.14"
dependencies = [
    "build123d>=0.13",
    "trimesh>=4.5",
    "manifold3d>=3.0",
    "pyvista>=0.44",
    "numpy",
    "rtree",
    "scipy",
    "networkx",
    "lxml",
    "bd-warehouse>=0.4.0",
]

[project.scripts]
cad = "cadlib.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cadlib"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
