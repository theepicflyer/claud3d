# Printer and material defaults. Projects can override any of these in model.py via PRINT = {...}.
# Your own setup goes in printer.local.toml (gitignored), which is merged over this file key by key.
# Profile names are Bambu Studio presets; list them with `uv run cad profiles <machine|process|filament> [regex]`.

[printer]
name = "Bambu Lab X2D"
# "bambu" slices with the Bambu Studio CLI and reads the printable area from machine_profile.
# "none" skips slicing and needs build_volume = [x, y, z] in mm instead (for other slicers or printers).
slicer = "bambu"
machine_profile = "Bambu Lab X2D 0.4 nozzle"
process_profile = "0.20mm Standard @BBL X2D"
nozzle = 0.4
layer_height = 0.2
# Per-nozzle print regions come from the machine preset (extruder_printable_area/height), not from here:
#   left (main, direct drive):   X 0-256,    Y 0-256, Z 261   -> 256 x 256 x 261 mm
#   right (auxiliary, Bowden):   X 20.5-256, Y 0-256, Z 256   -> 235.5 x 256 x 256 mm
# The right nozzle can't reach the leftmost 20.5 mm of the bed or the top 5 mm. Multi-material prints are
# limited to the shared region (235.5 x 256 x 256). Flexible filament (TPU) belongs on the direct-drive left nozzle.

[design]
min_wall = 1.2          # 3 perimeters at 0.4 nozzle; below this gets a warning
min_wall_hard = 0.8     # below 2 perimeters fails
overhang_angle = 45     # degrees from vertical before support is needed
max_bridge = 15         # mm, comfortable unsupported bridge span
max_cantilever = 2      # mm a flat ceiling may stick out past the wall below it without support
min_bed_contact = 50    # mm^2, warn below this

# Default diametral clearances for mating parts (mm, added to hole / subtracted from shaft in total).
[fit]
press = 0.10
snug = 0.20
slide = 0.30
loose = 0.50

[materials]
default = "pla"

[materials.pla]
filament_profile = "Bambu PLA Basic @BBL X2D 0.4 nozzle"
notes = "Default. Stiff, easy, weak above ~55 C. Good for prototypes, fixtures, indoor parts."

[materials.petg]
filament_profile = "Bambu PETG Basic @BBL X2D 0.4 nozzle"
clearance_extra = 0.05
notes = "Tougher and more heat/UV tolerant than PLA (~70 C). Layers fuse well; bridges and overhangs sag more. Add ~0.05 mm extra clearance."

[materials.abs-gf]
filament_profile = "Bambu ABS-GF @BBL X2D 0.4 nozzle"
clearance_extra = 0.05
notes = "Stiff, heat resistant (~95 C), dimensionally stable for ABS. Needs enclosure and filtration. Avoid sharp corners on large flat parts (warping) and thin snap features (brittle along fibers); abrasive, use hardened nozzle."

[materials.tpu]
filament_profile = "Bambu TPU 95A HF @BBL X2D 0.4 nozzle"
clearance_extra = 0.10
notes = "Flexible (95A). Left (direct-drive) nozzle only. Prints slow, strings, no AMS for standard TPU. Avoid supports and bridges, use thicker walls (>= 1.6 mm) and generous clearances."
